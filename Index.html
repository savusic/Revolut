<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>SEC0 Chart</title>

  <!-- Wichtig für Mobile Darstellung -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #0e1117;
      color: white;
      text-align: center;
    }

    h1 {
      padding: 10px;
      font-size: 18px;
    }

    .chart-container {
      width: 100%;
      height: 80vh; /* passt sich an Handyhöhe an */
    }
  </style>
</head>

<body>

  <h1>SEC0 – Semiconductor ETF Chart</h1>

  <div class="chart-container" id="tradingview_chart"></div>

  <!-- TradingView Script -->
  <script src="https://s3.tradingview.com/tv.js"></script>

  <script>
    new TradingView.widget({
      "autosize": true,
      "symbol": "SWB:SEC0",
      "interval": "D",
      "timezone": "Europe/Berlin",
      "theme": "light",
      "style": "1",
      "locale": "de",
      "toolbar_bg": "#0e1117",
      "enable_publishing": false,
      "hide_side_toolbar": false,
      "container_id": "tradingview_chart"
    });
  </script>

</body>
</html>
