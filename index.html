<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>ETFs Kompare</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #0e1117;
      color: white;
      text-align: center;
    }

    h1 {
      padding: 10px;
      font-size: 18px;
    }

    .chart-container {
      width: 100%;
      height: 60vh; /* etwas kleiner, damit mehrere passen */
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <h1>ETFs & Aktien Charts</h1>

  <!-- SEC0 -->
  <div class="chart-container" id="chart1"></div>

  <!-- XGDU -->
  <div class="chart-container" id="chart2"></div>

  <!-- NVIDIA -->
  <div class="chart-container" id="chart3"></div>

  <!-- PLTR -->
  <div class="chart-container" id="chart4"></div>

  <script src="https://s3.tradingview.com/tv.js"></script>

  <script>
    const commonConfig = {
      autosize: true,
      interval: "D",
      timezone: "Europe/Berlin",
      theme: "light",
      style: "1",
      locale: "de",
      toolbar_bg: "#0e1117",
      enable_publishing: false,
      hide_side_toolbar: false
    };

    new TradingView.widget({
      ...commonConfig,
      symbol: "SWB:SEC0",
      container_id: "chart1"
    });

    new TradingView.widget({
      ...commonConfig,
      symbol: "XETR:XGDU",
      container_id: "chart2"
    });

    new TradingView.widget({
      ...commonConfig,
      symbol: "NASDAQ:NVDA",
      container_id: "chart3"
    });

    new TradingView.widget({
      ...commonConfig,
      symbol: "NASDAQ:PLTR",
      container_id: "chart4"
    });
  </script>

</body>
</html>
