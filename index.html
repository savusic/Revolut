<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>ETFs Kompare</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #0e1117;
      color: white;
      text-align: center;
      transition: background 0.3s, color 0.3s;
    }

    h1 {
      padding: 10px;
      font-size: 18px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px;
    }

    .btn {
      padding: 8px 12px;
      border-radius: 10px;
      border: none;
      background: #1f2937;
      color: white;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #374151;
      transform: scale(1.05);
    }

    .active {
      background: #2563eb;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.7);
    }

    .chart-container {
      width: 100%;
      height: 75vh;
      margin-top: 10px;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .fade {
      opacity: 0.3;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 10px;
    }

    .toggle {
      background: #1f2937;
      border: none;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Light Mode */
    .light-mode {
      background-color: #f5f5f5;
      color: black;
    }

    .light-mode .btn {
      background: #e5e7eb;
      color: black;
    }

    .light-mode .active {
      background: #2563eb;
      color: white;
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <div></div>
    <button class="toggle" onclick="toggleTheme()">🌗</button>
  </div>

  <h1>📊 ETFs & Aktien Charts</h1>

  <div class="controls">
    <button class="btn" onclick="changeSymbol('SWB:SEC0', this)">💾 SEC0</button>
    <button class="btn" onclick="changeSymbol('XETR:XGDU', this)">🥇 XGDU</button>
    <button class="btn" onclick="changeSymbol('NASDAQ:NVDA', this)">⚡ NVDA</button>
    <button class="btn" onclick="changeSymbol('NASDAQ:PLTR', this)">🚀 PLTR</button>
    <button class="btn" onclick="changeSymbol('INDEX:BTCUSD', this)">💰 BTC</button>
    <button class="btn" onclick="changeSymbol('INDEX:ETHUSD', this)">🟣 ETH</button>
    <button class="btn" onclick="changeSymbol('INDEX:SOLUSD', this)">💎 SOL</button>
    <button class="btn" onclick="changeSymbol('INDEX:XRPUSD', this)">💧 XRP</button>
    <button class="btn" onclick="changeSymbol('INDEX:ADAUSD', this)">🌐 ADA</button>
  </div>

  <div id="chart" class="chart-container"></div>

  <script src="https://s3.tradingview.com/tv.js"></script>

  <script>
    let currentSymbol = localStorage.getItem("lastSymbol") || "SWB:SEC0";
    let currentTheme = localStorage.getItem("theme") || "dark";

    function loadChart(symbol) {
      const chartDiv = document.getElementById("chart");
      chartDiv.classList.add("fade");

      setTimeout(() => {
        chartDiv.innerHTML = "";

        new TradingView.widget({
          autosize: true,
          symbol: symbol,
          interval: "D",
          timezone: "Europe/Berlin",
          theme: currentTheme === "dark" ? "dark" : "light",
          style: "1",
          locale: "de",
          container_id: "chart",
          toolbar_bg: "#0e1117",
          enable_publishing: false,
          hide_side_toolbar: false
        });

        chartDiv.classList.remove("fade");
      }, 200);
    }

    function changeSymbol(symbol, btn) {
      currentSymbol = symbol;
      localStorage.setItem("lastSymbol", symbol);

      loadChart(symbol);

      document.querySelectorAll(".btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    }

    function toggleTheme() {
      if (currentTheme === "dark") {
        currentTheme = "light";
        document.body.classList.add("light-mode");
      } else {
        currentTheme = "dark";
        document.body.classList.remove("light-mode");
      }

      localStorage.setItem("theme", currentTheme);
      loadChart(currentSymbol);
    }

    // Initial Setup
    window.onload = () => {
      if (currentTheme === "light") {
        document.body.classList.add("light-mode");
      }

      loadChart(currentSymbol);

      // aktiven Button setzen
      document.querySelectorAll(".btn").forEach(btn => {
        if (btn.getAttribute("onclick").includes(currentSymbol)) {
          btn.classList.add("active");
        }
      });
    };
  </script>

</body>
</html>
