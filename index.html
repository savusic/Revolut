<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>ETFs Kompare</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #0e1117;
      color: white;
      text-align: center;
    }

    h1 {
      padding: 10px;
      font-size: 18px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px;
    }

    .btn {
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      background: #1f2937;
      color: white;
      cursor: pointer;
      font-size: 13px;
    }

    .btn:hover {
      background: #374151;
    }

    .active {
      background: #2563eb;
    }

    .chart-container {
      width: 100%;
      height: 75vh;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h1>ETFs & Aktien Charts</h1>

  <div class="controls">
    <button class="btn active" onclick="changeSymbol('SWB:SEC0', this)">SEC0</button>
    <button class="btn" onclick="changeSymbol('XETR:XGDU', this)">XGDU</button>
    <button class="btn" onclick="changeSymbol('NASDAQ:NVDA', this)">NVDA</button>
    <button class="btn" onclick="changeSymbol('NASDAQ:PLTR', this)">PLTR</button>
  </div>

  <div id="chart" class="chart-container"></div>

  <!-- TradingView -->
  <script src="https://s3.tradingview.com/tv.js"></script>

  <script>
    let currentSymbol = "SWB:SEC0";

    function loadChart(symbol) {
      document.getElementById("chart").innerHTML = "";

      new TradingView.widget({
        autosize: true,
        symbol: symbol,
        interval: "D",
        timezone: "Europe/Berlin",
        theme: "light",
        style: "1",
        locale: "de",
        container_id: "chart",
        toolbar_bg: "#0e1117",
        enable_publishing: false,
        hide_side_toolbar: false
      });
    }

    function changeSymbol(symbol, btn) {
      currentSymbol = symbol;
      loadChart(symbol);

      // aktiven Button hervorheben
      document.querySelectorAll(".btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    }

    // Initial laden
    loadChart(currentSymbol);
  </script>

</body>
</html>
